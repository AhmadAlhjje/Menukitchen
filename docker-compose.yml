services:
  menukitchen-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://217.76.53.136:7050
    container_name: menukitchen-frontend
    restart: unless-stopped
    ports:
      - "7052:7052"
    environment:
      - NODE_ENV=production
      - PORT=7052
    networks:
      - menukitchen-network

networks:
  menukitchen-network:
    driver: bridge
